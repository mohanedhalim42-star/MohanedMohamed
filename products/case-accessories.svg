<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091124" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="magRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="cBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#bgCase)" />
  <circle cx="300" cy="230" r="130" fill="#3b82f6" opacity="0.12" filter="url(#cBloom)" />

  <!-- Magnetic Shockproof Armor Case -->
  <g transform="translate(210, 60)">
    <!-- Case Exterior -->
    <rect x="0" y="0" width="180" height="340" rx="28" fill="url(#armorGrad)" stroke="#38bdf8" stroke-width="2" />
    <!-- Reinforced Corners -->
    <path d="M0 28 Q0 0 28 0 L40 0 L40 10 L10 10 L10 40 L0 40 Z" fill="#00e5ff" />
    <path d="M180 28 Q180 0 152 0 L140 0 L140 10 L170 10 L170 40 L180 40 Z" fill="#00e5ff" />
    <path d="M0 312 Q0 340 28 340 L40 340 L40 330 L10 330 L10 300 L0 300 Z" fill="#00e5ff" />
    <path d="M180 312 Q180 340 152 340 L140 340 L140 330 L170 330 L170 300 L180 300 Z" fill="#00e5ff" />

    <!-- Camera Lens Bump -->
    <rect x="18" y="20" width="68" height="74" rx="16" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <circle cx="36" cy="40" r="12" fill="#020617" stroke="#00e5ff" stroke-width="1.5" />
    <circle cx="68" cy="40" r="12" fill="#020617" stroke="#00e5ff" stroke-width="1.5" />
    <circle cx="36" cy="72" r="12" fill="#020617" stroke="#00e5ff" stroke-width="1.5" />
    <circle cx="68" cy="72" r="6" fill="#f59e0b" />

    <!-- MagSafe Ring Indicator -->
    <g transform="translate(90, 190)">
      <circle cx="0" cy="0" r="46" fill="none" stroke="url(#magRing)" stroke-width="4" filter="url(#cBloom)" />
      <rect x="-4" y="52" width="8" height="24" rx="4" fill="url(#magRing)" />
    </g>
  </g>

  <!-- Title Badge -->
  <rect x="170" y="425" width="260" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="300" y="449" fill="#ffffff" font-family="'Segoe UI', Tahoma" font-size="14" font-weight="bold" text-anchor="middle">📱 جراب ماج سيف مضاد للصدمات</text>
</svg>
