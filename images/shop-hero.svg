<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0f1b38" />
      <stop offset="100%" stop-color="#091326" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="650" rx="24" fill="url(#bgGrad)" />

  <!-- Cyber Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="650" />
    <line x1="250" y1="0" x2="250" y2="650" />
    <line x1="400" y1="0" x2="400" y2="650" />
    <line x1="550" y1="0" x2="550" y2="650" />
    <line x1="700" y1="0" x2="700" y2="650" />
    <line x1="850" y1="0" x2="850" y2="650" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="360" x2="1000" y2="360" />
    <line x1="0" y1="480" x2="1000" y2="480" />
    <line x1="0" y1="600" x2="1000" y2="600" />
  </g>

  <!-- Glowing Tech Orbs in Background -->
  <circle cx="500" cy="300" r="160" fill="#00e5ff" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="750" cy="200" r="120" fill="#3b82f6" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="250" cy="400" r="140" fill="#06b6d4" opacity="0.1" filter="url(#softGlow)" />

  <!-- Isometric Tech Pedestal -->
  <ellipse cx="500" cy="530" rx="360" ry="60" fill="#0f172a" stroke="#00e5ff" stroke-width="2" opacity="0.6" filter="url(#neonGlow)" />
  <ellipse cx="500" cy="530" rx="310" ry="48" fill="#111f3d" stroke="#3b82f6" stroke-width="1.5" opacity="0.8" />
  <ellipse cx="500" cy="530" rx="250" ry="36" fill="#070c18" stroke="#00f2fe" stroke-dasharray="8,8" stroke-width="2" opacity="0.9" />

  <!-- Central Flagship Smartphone Body -->
  <g transform="translate(410, 100)">
    <!-- Shadow -->
    <rect x="-10" y="20" width="180" height="360" rx="34" fill="#000000" opacity="0.5" filter="url(#softGlow)" />
    <!-- Phone Outer Shell -->
    <rect x="0" y="0" width="180" height="360" rx="32" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="3" />
    <!-- Screen Inner Border -->
    <rect x="6" y="6" width="168" height="348" rx="26" fill="url(#phoneScreen)" />
    
    <!-- Dynamic Island / Top Notch -->
    <rect x="65" y="16" width="50" height="12" rx="6" fill="#000000" stroke="#334155" stroke-width="1" />
    <circle cx="102" cy="22" r="3" fill="#00e5ff" />

    <!-- Screen Futuristic Content -->
    <circle cx="90" cy="110" r="32" fill="#0c1527" stroke="#00e5ff" stroke-width="1.5" />
    <path d="M78 110 L90 98 L102 110 L90 122 Z" fill="none" stroke="#00f2fe" stroke-width="2.5" />
    <circle cx="90" cy="110" r="6" fill="#00e5ff" />

    <!-- Soundwaves / Tech Bars -->
    <rect x="40" y="165" width="100" height="4" rx="2" fill="#334155" />
    <rect x="40" y="165" width="65" height="4" rx="2" fill="url(#cyanGrad)" />

    <!-- Repair Chip / Motherboard visual on screen -->
    <g transform="translate(35, 195)">
      <rect width="110" height="85" rx="10" fill="#0f172a" stroke="#1e293b" />
      <circle cx="25" cy="25" r="8" fill="#10b981" opacity="0.2" />
      <circle cx="25" cy="25" r="4" fill="#10b981" />
      <text x="40" y="29" fill="#94a3b8" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold">Motherboard OK</text>
      <rect x="15" y="45" width="80" height="4" rx="2" fill="#1e293b" />
      <rect x="15" y="45" width="60" height="4" rx="2" fill="#3b82f6" />
      <text x="15" y="68" fill="#00e5ff" font-family="'Segoe UI', Arial" font-size="10">High Precision Tech</text>
    </g>

    <!-- Bottom Indicator -->
    <rect x="65" y="338" width="50" height="4" rx="2" fill="#64748b" />
  </g>

  <!-- Left Side: Smart Watch Floating -->
  <g transform="translate(200, 210)">
    <rect x="50" y="0" width="40" height="240" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="35" y="55" width="70" height="85" rx="18" fill="#0f172a" stroke="#00e5ff" stroke-width="2.5" filter="url(#neonGlow)" />
    <rect x="42" y="62" width="56" height="71" rx="12" fill="#020617" />
    <circle cx="70" cy="95" r="22" fill="none" stroke="#1e293b" stroke-width="3" />
    <circle cx="70" cy="95" r="22" fill="none" stroke="#00e5ff" stroke-width="3" stroke-dasharray="100" stroke-dashoffset="30" />
    <circle cx="70" cy="95" r="16" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="70" stroke-dashoffset="20" />
    <text x="70" y="99" fill="#ffffff" font-family="'Segoe UI', Arial" font-size="10" font-weight="bold" text-anchor="middle">10:45</text>
    <text x="70" y="118" fill="#00e5ff" font-family="'Segoe UI', Arial" font-size="7" text-anchor="middle">Dar Elsalam</text>
  </g>

  <!-- Right Side: AirPods Pro Case & Buds -->
  <g transform="translate(680, 240)">
    <rect x="0" y="40" width="105" height="85" rx="26" fill="#1e293b" stroke="#00f2fe" stroke-width="2" filter="url(#neonGlow)" />
    <path d="M0 68 L105 68" stroke="#334155" stroke-width="1.5" />
    <circle cx="52" cy="78" r="3" fill="#10b981" />
    <g transform="translate(20, -35) rotate(-15)">
      <ellipse cx="20" cy="20" rx="14" ry="12" fill="#f8fafc" />
      <rect x="16" y="24" width="8" height="32" rx="4" fill="#f8fafc" />
      <circle cx="20" cy="18" r="4" fill="#0f172a" />
      <circle cx="20" cy="54" r="2.5" fill="#cbd5e1" />
    </g>
    <g transform="translate(60, -30) rotate(15)">
      <ellipse cx="20" cy="20" rx="14" ry="12" fill="#f8fafc" />
      <rect x="16" y="24" width="8" height="32" rx="4" fill="#f8fafc" />
      <circle cx="20" cy="18" r="4" fill="#0f172a" />
      <circle cx="20" cy="54" r="2.5" fill="#cbd5e1" />
    </g>
  </g>

  <!-- Floating Badges -->
  <g transform="translate(130, 420)">
    <rect width="170" height="50" rx="12" fill="#0c1527" stroke="#00e5ff" stroke-width="1" opacity="0.9" />
    <text x="25" y="32" font-size="20">🔧</text>
    <text x="58" y="26" fill="#ffffff" font-family="'Segoe UI', Tahoma" font-size="12" font-weight="bold">مركز صيانة فوري</text>
    <text x="58" y="42" fill="#38bdf8" font-family="'Segoe UI', Tahoma" font-size="10">قطع غيار أصلية 100%</text>
  </g>

  <g transform="translate(700, 420)">
    <rect width="180" height="50" rx="12" fill="#0c1527" stroke="#3b82f6" stroke-width="1" opacity="0.9" />
    <text x="25" y="32" font-size="20">🚚</text>
    <text x="58" y="26" fill="#ffffff" font-family="'Segoe UI', Tahoma" font-size="12" font-weight="bold">شحن سريع ومباشر</text>
    <text x="58" y="42" fill="#38bdf8" font-family="'Segoe UI', Tahoma" font-size="10">الإسكندرية وجميع المحافظات</text>
  </g>
</svg>
