<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1e" />
      <stop offset="100%" stop-color="#020409" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ff3b30" />
    </linearGradient>
    <filter id="watGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#bgWat)" />
  <circle cx="300" cy="225" r="140" fill="#ff7b00" opacity="0.09" filter="url(#watGlow)" />

  <!-- Ultra Smart Watch -->
  <g transform="translate(230, 40)">
    <!-- Watch Straps (Alpine loop style) -->
    <rect x="35" y="0" width="70" height="370" rx="14" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <!-- Ridges on Strap -->
    <line x1="35" y1="40" x2="105" y2="40" stroke="#1e293b" stroke-width="3" />
    <line x1="35" y1="60" x2="105" y2="60" stroke="#1e293b" stroke-width="3" />
    <line x1="35" y1="310" x2="105" y2="310" stroke="#1e293b" stroke-width="3" />
    <line x1="35" y1="330" x2="105" y2="330" stroke="#1e293b" stroke-width="3" />

    <!-- Titanium Watch Case -->
    <rect x="15" y="90" width="110" height="170" rx="30" fill="#1e293b" stroke="#94a3b8" stroke-width="3" />
    
    <!-- Digital Crown & Side Action Button -->
    <rect x="122" y="115" width="12" height="32" rx="4" fill="#ff7b00" filter="url(#watGlow)" />
    <rect x="6" y="140" width="10" height="36" rx="4" fill="#ff7b00" />

    <!-- AMOLED Display Frame -->
    <rect x="25" y="102" width="90" height="146" rx="20" fill="#020617" stroke="#334155" stroke-width="2" />

    <!-- Screen UI Elements -->
    <text x="70" y="145" fill="#f8fafc" font-family="'Segoe UI', Arial" font-size="28" font-weight="900" text-anchor="middle">09:41</text>
    <text x="70" y="165" fill="#00e5ff" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold" text-anchor="middle">DAR ELSALAM</text>
    
    <!-- Heart Rate & Fitness Rings -->
    <circle cx="70" cy="205" r="26" fill="none" stroke="#1e293b" stroke-width="5" />
    <circle cx="70" cy="205" r="26" fill="none" stroke="#ff3b30" stroke-width="5" stroke-dasharray="140" stroke-dashoffset="35" />
    <circle cx="70" cy="205" r="18" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="100" stroke-dashoffset="20" />
    <text x="70" y="209" fill="#f8fafc" font-family="'Segoe UI', Arial" font-size="9" font-weight="bold" text-anchor="middle">❤️ 78</text>
  </g>

  <!-- Title Badge -->
  <rect x="160" y="425" width="280" height="38" rx="19" fill="#1e293b" stroke="#ff7b00" stroke-width="1.5" />
  <text x="300" y="449" fill="#ffffff" font-family="'Segoe UI', Tahoma" font-size="14" font-weight="bold" text-anchor="middle">⌚ ساعة ذكية Smart Watch Ultra شاشة AMOLED</text>
</svg>
