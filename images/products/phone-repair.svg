<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowFlt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#bgP1)" />
  <circle cx="300" cy="250" r="140" fill="#00e5ff" opacity="0.1" filter="url(#glowFlt)" />
  
  <!-- Disassembled Phone Screen & Motherboard Circuit Repair -->
  <g transform="translate(190, 80)">
    <!-- Circuit Base Board -->
    <rect x="0" y="40" width="220" height="300" rx="20" fill="#0f172a" stroke="url(#blueGlow)" stroke-width="2" />
    <!-- Tracks -->
    <path d="M40 80 L90 80 L110 120 L180 120" stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.7" />
    <path d="M50 200 L120 200 L140 240 L180 240" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7" />
    <circle cx="40" cy="80" r="4" fill="#00e5ff" />
    <circle cx="180" cy="120" r="4" fill="#00e5ff" />
    <circle cx="50" cy="200" r="4" fill="#38bdf8" />
    <circle cx="180" cy="240" r="4" fill="#38bdf8" />
    
    <!-- Central CPU Chip -->
    <rect x="75" y="130" width="70" height="70" rx="10" fill="#1e293b" stroke="#00e5ff" stroke-width="2" />
    <text x="110" y="165" fill="#f8fafc" font-family="'Segoe UI', Arial" font-size="14" font-weight="bold" text-anchor="middle">CPU BIONIC</text>
    <text x="110" y="183" fill="#00e5ff" font-family="'Segoe UI', Arial" font-size="10" text-anchor="middle">PRECISION FIX</text>

    <!-- Tweezers / Repair Tool -->
    <g transform="translate(130, 20) rotate(25)">
      <path d="M10 0 L18 100 L12 105 L0 0 Z" fill="#94a3b8" />
      <path d="M14 0 L22 100 L16 105 L4 0 Z" fill="#cbd5e1" />
      <circle cx="14" cy="98" r="4" fill="#00e5ff" filter="url(#glowFlt)" />
    </g>
  </g>

  <!-- Title Badge -->
  <rect x="180" y="420" width="240" height="38" rx="19" fill="#1e293b" stroke="#00e5ff" stroke-width="1.5" />
  <text x="300" y="444" fill="#ffffff" font-family="'Segoe UI', Tahoma" font-size="14" font-weight="bold" text-anchor="middle">🔧 صيانة موبايلات وشاشات</text>
</svg>
