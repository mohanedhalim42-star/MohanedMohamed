<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e21" />
      <stop offset="100%" stop-color="#03060d" />
    </linearGradient>
    <linearGradient id="podBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="airGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#bgAir)" />
  <circle cx="300" cy="240" r="140" fill="#00e5ff" opacity="0.1" filter="url(#airGlow)" />

  <!-- Charging Case Open Base -->
  <g transform="translate(190, 150)">
    <!-- Case Base -->
    <rect x="20" y="80" width="180" height="140" rx="45" fill="#0f172a" stroke="#00e5ff" stroke-width="2.5" />
    <!-- Inner Cavity for pods -->
    <ellipse cx="65" cy="90" rx="30" ry="18" fill="#020617" />
    <ellipse cx="155" cy="90" rx="30" ry="18" fill="#020617" />
    <!-- Status LED -->
    <circle cx="110" cy="150" r="4" fill="#10b981" filter="url(#airGlow)" />
  </g>

  <!-- Left AirPod Hovering -->
  <g transform="translate(210, 80) rotate(-15)">
    <ellipse cx="40" cy="40" rx="28" ry="24" fill="url(#podBody)" />
    <!-- Silicone Tip -->
    <ellipse cx="20" cy="38" rx="14" ry="18" fill="#94a3b8" />
    <!-- Stem -->
    <rect x="36" y="55" width="14" height="60" rx="7" fill="url(#podBody)" />
    <circle cx="43" cy="110" r="4" fill="#64748b" />
    <rect x="42" y="70" width="2" height="18" rx="1" fill="#334155" />
    <!-- Speaker mesh -->
    <ellipse cx="38" cy="38" rx="7" ry="5" fill="#1e293b" />
  </g>

  <!-- Right AirPod Hovering -->
  <g transform="translate(320, 70) rotate(15)">
    <ellipse cx="40" cy="40" rx="28" ry="24" fill="url(#podBody)" />
    <!-- Silicone Tip -->
    <ellipse cx="60" cy="38" rx="14" ry="18" fill="#94a3b8" />
    <!-- Stem -->
    <rect x="30" y="55" width="14" height="60" rx="7" fill="url(#podBody)" />
    <circle cx="37" cy="110" r="4" fill="#64748b" />
    <rect x="36" y="70" width="2" height="18" rx="1" fill="#334155" />
    <!-- Speaker mesh -->
    <ellipse cx="42" cy="38" rx="7" ry="5" fill="#1e293b" />
  </g>

  <!-- Audio Waveform Badges -->
  <g stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="140" y1="180" x2="140" y2="200" />
    <line x1="150" y1="165" x2="150" y2="215" />
    <line x1="160" y1="175" x2="160" y2="205" />
    
    <line x1="440" y1="175" x2="440" y2="205" />
    <line x1="450" y1="165" x2="450" y2="215" />
    <line x1="460" y1="180" x2="460" y2="200" />
  </g>

  <!-- Title Badge -->
  <rect x="160" y="425" width="280" height="38" rx="19" fill="#1e293b" stroke="#00e5ff" stroke-width="1.5" />
  <text x="300" y="449" fill="#ffffff" font-family="'Segoe UI', Tahoma" font-size="14" font-weight="bold" text-anchor="middle">🎧 سماعات AirPods Pro عزل ضوضاء ANC</text>
</svg>
