<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1428" />
      <stop offset="100%" stop-color="#040813" />
    </linearGradient>
    <linearGradient id="pbShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="pbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="500" rx="16" fill="url(#bgPB)" />
  <circle cx="300" cy="225" r="140" fill="#00e5ff" opacity="0.1" filter="url(#pbGlow)" />

  <!-- 20000mAh Power Bank Body -->
  <g transform="translate(205, 50)">
    <!-- Main Chassis -->
    <rect x="0" y="20" width="190" height="320" rx="26" fill="url(#pbShell)" stroke="#00e5ff" stroke-width="2.5" />
    
    <!-- Matte Texture pattern -->
    <rect x="15" y="40" width="160" height="230" rx="16" fill="#091124" stroke="#1e293b" stroke-width="1.5" />

    <!-- Digital LED Percentage Display -->
    <rect x="50" y="70" width="90" height="46" rx="12" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
    <text x="95" y="103" fill="#00e5ff" font-family="'Segoe UI', Arial" font-size="24" font-weight="bold" text-anchor="middle" filter="url(#pbGlow)">100%</text>
    <circle cx="125" cy="83" r="3" fill="#22c55e" />

    <!-- Battery Capacity Engraving -->
    <text x="95" y="160" fill="#f8fafc" font-family="'Segoe UI', Arial" font-size="16" font-weight="900" text-anchor="middle">20,000 mAh</text>
    <text x="95" y="185" fill="#94a3b8" font-family="'Segoe UI', Arial" font-size="11" text-anchor="middle">SUPER FAST CHARGE 22.5W</text>
    <line x1="45" y1="205" x2="145" y2="205" stroke="#334155" stroke-width="1.5" />
    <text x="95" y="225" fill="#38bdf8" font-family="'Segoe UI', Arial" font-size="10" text-anchor="middle">PD 3.0 • QC 4.0</text>

    <!-- Top Output Ports -->
    <rect x="35" y="0" width="30" height="20" rx="4" fill="#334155" stroke="#00e5ff" stroke-width="1" />
    <rect x="80" y="0" width="30" height="20" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1" />
    <rect x="125" y="0" width="30" height="20" rx="4" fill="#334155" stroke="#00e5ff" stroke-width="1" />
  </g>

  <!-- Title Badge -->
  <rect x="160" y="425" width="280" height="38" rx="19" fill="#1e293b" stroke="#00e5ff" stroke-width="1.5" />
  <text x="300" y="449" fill="#ffffff" font-family="'Segoe UI', Tahoma" font-size="14" font-weight="bold" text-anchor="middle">⚡ باور بنك 20,000mAh شحن فائق السرعة</text>
</svg>
